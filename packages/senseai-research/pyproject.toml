[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "senseai-research"
version = "0.1.0"
description = "Evidence ledger and agentic chat for reviewing the SenseAI species library"
readme = "README.md"
requires-python = ">=3.11"  # senseai-profiles needs 3.11 (spec §13 says 3.10; see docs/SPEC.md Deviations)
license = "Apache-2.0"
dependencies = [
  # senseai-profiles is private and not on PyPI: pinned to the main the spec was built against.
  "senseai-profiles[curate] @ git+https://github.com/senseai-institute/profiles@018d2d6009959d0b66a90f234ffcb4da3c0a059d#subdirectory=packages/senseai-profiles",
  "anthropic>=1.15",
  "httpx2>=2.0",  # tests hand the SDK an httpx2 transport (recorded responses)
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "pydantic>=2.7",
  "jsonschema>=4.20",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "numpy>=1.26",
]

[project.optional-dependencies]
# The experiment engine runs senseai-bench as a subprocess (SENSEAI_BENCH_CMD) and reads world's
# PriorParams from the installed package when present; neither is imported at module level, so
# neither is a hard dependency (both pull torch). On the EC2 box they live in ~/senseai/.venv.
aws = ["boto3>=1.34"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "playwright==1.56.0",  # spec 11 in the browser (same pin as the viewer)
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-jsonschema",
]

[project.scripts]
senseai-research = "senseai_research.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/senseai_research"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "RUF", "SIM"]
ignore = ["RUF001", "RUF002", "RUF003", "N818"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_unreachable = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["senseai_profiles", "senseai_profiles.*", "senseai_world", "senseai_world.*", "boto3", "boto3.*", "sse_starlette", "sse_starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "profiles: needs the senseai-profiles package (skipped when it is not installed)",
]
